name: gestion — tests

on:
  pull_request:
    paths:
      - "apps/gestion/**"
      - ".github/workflows/gestion-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de la logique métier
        run: npm test
