name: gestion — deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/gestion/worker.js"
      - "apps/gestion/lib/**"
      - "apps/gestion/wrangler.jsonc"
      - "apps/gestion/package.json"
      - "apps/gestion/d1/**"
      - "apps/gestion/public/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestion-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gestion
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de la logique métier
        run: npm test
      - name: Déployer le Worker 'gestion'
        run: npx -y wrangler@4.163.0 deploy
      - name: Custom domain gestion.edukisto.win (best effort)
        run: |
          ZONE_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=edukisto.win&status=active" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "Zone edukisto.win non lisible avec ce token : ajouter la custom domain dans le dashboard."
            exit 0
          fi
          curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d "{\"hostname\":\"gestion.edukisto.win\",\"service\":\"gestion\",\"zone_id\":\"$ZONE_ID\",\"environment\":\"production\"}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" | jq '{success, errors}'
          echo "Si refusé : Workers & Pages > gestion > Settings > Domains & Routes > Add > gestion.edukisto.win"
