<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeux du Pendu</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      padding: 30px;
      width: 90%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    .game-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .word-display {
      font-size: 2.5rem;
      text-align: center;
      font-weight: bold;
      color: #3498db;
      letter-spacing: 6px;
      margin-bottom: 10px;
    }

    .hangman {
      display: flex;
      justify-content: center;
      height: 250px;
      position: relative;
    }

    .hangman svg {
      width: 200px;
      height: 250px;
    }

    .letters-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }

    button.letter-btn {
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.letter-btn:hover {
      background-color: #2980b9;
      transform: scale(1.05);
    }

    button.letter-btn.disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .game-status {
      text-align: center;
      font-size: 1.2rem;
      margin-top: 15px;
      color: #2c3e50;
      font-weight: bold;
    }

    button.reset-btn {
      display: block;
      width: 180px;
      padding: 10px;
      margin: 20px auto;
      background-color: #e67e22;
      color: white;
      border: none;
      font-size: 1.2rem;
      border-radius: 30px;
      cursor: pointer;
    }

    button.reset-btn:hover {
      background-color: #d35400;
    }

    .win-message, .lose-message {
      font-size: 1.8rem;
      text-align: center;
      margin-top: 20px;
      color: #27ae60;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Jeux du Pendu</h1>

    <div class="game-area">
      <div class="word-display" id="wordDisplay">_______</div>

      <div class="hangman">
        <svg viewBox="0 0 200 250">
          <!-- Base -->
          <line x1="30" y1="240" x2="170" y2="240" stroke="black" stroke-width="4" />
          <line x1="60" y1="240" x2="60" y2="50" stroke="black" stroke-width="4" />
          <line x1="60" y1="50" x2="130" y2="50" stroke="black" stroke-width="4" />
          <line x1="130" y1="50" x2="130" y2="70" stroke="black" stroke-width="4" />

          <!-- Head -->
          <circle id="head" cx="130" cy="80" r="15" fill="none" stroke="black" stroke-width="4" visibility="hidden" />

          <!-- Body -->
          <line id="body" x1="130" y1="95" x2="130" y2="145" stroke="black" stroke-width="4" visibility="hidden" />

          <!-- Left arm -->
          <line id="leftArm" x1="130" y1="115" x2="105" y2="125" stroke="black" stroke-width="4" visibility="hidden" />

          <!-- Right arm -->
          <line id="rightArm" x1="130" y1="115" x2="155" y2="125" stroke="black" stroke-width="4" visibility="hidden" />

          <!-- Left leg -->
          <line id="leftLeg" x1="130" y1="145" x2="110" y2="185" stroke="black" stroke-width="4" visibility="hidden" />

          <!-- Right leg -->
          <line id="rightLeg" x1="130" y1="145" x2="150" y2="185" stroke="black" stroke-width="4" visibility="hidden" />
        </svg>
      </div>

      <div class="letters-container" id="letterButtons">
        <!-- Buttons will be generated by JS -->
      </div>

      <p class="game-status" id="gameStatus">Propose une lettre</p>

      <button class="reset-btn" id="resetBtn">Nouvelle partie</button>

      <div class="win-message" id="winMessage">
        Bravo ! Tu as gagné.
      </div>
      <div class="lose-message" id="loseMessage">
        Dommage, le mot était : <span id="finalWord"></span>.
      </div>
    </div>
  </div>

  <script>
    const words = [
      'javascript',
      'algorithm',
      'computer',
      'programming',
      'development',
      'variable',
      'function',
      'database',
      'interface',
      'software',
      'network',
      'security',
      'framework',
      'responsive',
      'design'
    ];

    let selectedWord = '';
    let guessedLetters = [];
    let mistakes = 0;
    const maxMistakes = 6;

    // DOM elements
    const wordDisplayElement = document.getElementById('wordDisplay');
    const gameStatusElement = document.getElementById('gameStatus');
    const resetBtn = document.getElementById('resetBtn');
    const winMessageElement = document.getElementById('winMessage');
    const loseMessageElement = document.getElementById('loseMessage');
    const finalWordElement = document.getElementById('finalWord');
    const letterButtonsContainer = document.getElementById('letterButtons');

    // Initialize game
    function initGame() {
      selectedWord = words[Math.floor(Math.random() * words.length)].toUpperCase();
      guessedLetters = [];
      mistakes = 0;
      updateWordDisplay();
      resetHangman();
      createLetterButtons();
      gameStatusElement.textContent = 'Propose une lettre';
      winMessageElement.style.display = 'none';
      loseMessageElement.style.display = 'none';
    }

    // Update displayed word with guessed letters
    function updateWordDisplay() {
      const display = selectedWord
        .split('')
        .map(letter => (guessedLetters.includes(letter) ? letter : '_'))
        .join(' ');
      wordDisplayElement.textContent = display;

      if (!display.includes('_')) {
        endGame(true);
      }
    }

    // Create letter buttons for A-Z
    function createLetterButtons() {
      letterButtonsContainer.innerHTML = '';
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      for (const letter of alphabet) {
        const button = document.createElement('button');
        button.classList.add('letter-btn');
        button.textContent = letter;
        button.dataset.letter = letter;
        button.addEventListener('click', function() {
          handleLetterClick(letter);
        });
        letterButtonsContainer.appendChild(button);
      }
    }

    // Handle click on a letter button
    function handleLetterClick(letter) {
      if (guessedLetters.includes(letter)) return;

      guessedLetters.push(letter);
      updateWordDisplay();

      if (!selectedWord.includes(letter)) {
        mistakes++;
        updateHangman();
      }

      if (mistakes >= maxMistakes) {
        endGame(false);
      }
    }

    // Update hangman drawing based on number of mistakes
    function updateHangman() {
      const parts = [
        'head',
        'body',
        'leftArm',
        'rightArm',
        'leftLeg',
        'rightLeg'
      ];

      for (let i = 0; i < mistakes; i++) {
        const part = document.getElementById(parts[i]);
        if (part) {
          part.setAttribute('visibility', 'visible');
        }
      }
    }

    // Reset hangman to initial state
    function resetHangman() {
      const parts = ['head', 'body', 'leftArm', 'rightArm', 'leftLeg', 'rightLeg'];
      for (const part of parts) {
        document.getElementById(part).setAttribute('visibility', 'hidden');
      }
    }

    // End game: win or lose
    function endGame(isWin) {
      if (isWin) {
        gameStatusElement.textContent = 'Tu as gagné !';
        winMessageElement.style.display = 'block';
      } else {
        finalWordElement.textContent = selectedWord;
        gameStatusElement.textContent = 'Perdu ! Le mot était : ' + selectedWord;
        loseMessageElement.style.display = 'block';
      }

      // Disable all letter buttons
      const letterButtons = document.querySelectorAll('.letter-btn');
      letterButtons.forEach(btn => {
        btn.classList.add('disabled');
        btn.disabled = true;
      });
    }

    // Reset game on button click
    resetBtn.addEventListener('click', initGame);

    // Start the game
    initGame();
  </script>
</body>
</html>
